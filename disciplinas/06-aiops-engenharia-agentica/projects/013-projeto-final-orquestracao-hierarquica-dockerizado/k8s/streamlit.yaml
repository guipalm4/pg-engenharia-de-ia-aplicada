apiVersion: v1
kind: Service
metadata:
  name: nexus-ui
spec:
  selector:
    app: nexus-ui
  ports:
    - port: 8501
      targetPort: 8501
  type: LoadBalancer # Facilita o acesso via túnel no Minikube
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexus-ui
  template:
    metadata:
      labels:
        app: nexus-ui
    spec:
      containers:
        - name: streamlit
          image: nexus-bot:v3
          # A imagem só existe no daemon do Minikube: nunca buscar no registry.
          imagePullPolicy: Never

          # `python -m streamlit` em vez do binário `streamlit`: não depende do
          # console_script estar no $PATH, e falha com um traceback Python legível
          # em vez de um OCI runtime error opaco.
          command:
            ["python", "-m", "streamlit", "run", "ui/app.py"]
          args:
            - "--server.port=8501"
            - "--server.address=0.0.0.0"
            - "--server.headless=true"
            - "--browser.gatherUsageStats=false"

          ports:
            - containerPort: 8501

          env:
            - name: AWS_ENDPOINT_URL
              value: "http://localstack:4566"
            - name: AWS_ACCESS_KEY_ID
              value: "test"
            - name: AWS_SECRET_ACCESS_KEY
              value: "test"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
            # ui/app.py importa tools.security_scan -> crewai.tools
            - name: PYTHONPATH
              value: "/app"
            - name: PYTHONUNBUFFERED
              value: "1"

          # 256Mi não cobria o import de crewai + litellm que ui/app.py puxa via
          # tools.security_scan: o pod ia de RunContainerError direto p/ OOMKilled.
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"

          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 45
            periodSeconds: 20
